<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download OM.ico</title>
</head>
<body style="font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh;">
  <h2>Generating OM.ico...</h2>
  <p>If the download did not start automatically, click the button below:</p>
  <button id="dlBtn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; background: #d4af37; color: #111; font-weight: bold;">Download OM.ico</button>

  <script>
    function generateAndDownloadICO() {
      // 1. Draw the icon on a 256x256 canvas
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Rounded rectangle path
      const x = 8, y = 8, w = 240, h = 240, r = 50;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();

      // Background fill
      const bgGrad = ctx.createLinearGradient(0, 0, 256, 256);
      bgGrad.addColorStop(0, '#1a1a1e');
      bgGrad.addColorStop(1, '#050505');
      ctx.fillStyle = bgGrad;
      ctx.fill();

      // Border
      const borderGrad = ctx.createLinearGradient(0, 0, 256, 256);
      borderGrad.addColorStop(0, '#555555');
      borderGrad.addColorStop(1, '#1f1f1f');
      ctx.lineWidth = 4;
      ctx.strokeStyle = borderGrad;
      ctx.stroke();

      // Text setup
      ctx.font = 'bold 112px "Times New Roman", "Cinzel", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Drop shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 6;

      // Gold gradient fill for OM
      const textGrad = ctx.createLinearGradient(50, 60, 200, 200);
      textGrad.addColorStop(0, '#fff4b8');
      textGrad.addColorStop(0.35, '#e5b53b');
      textGrad.addColorStop(0.7, '#b8860b');
      textGrad.addColorStop(1, '#7a5200');

      ctx.fillStyle = textGrad;
      ctx.fillText('OM', 128, 134);

      // Inner stroke highlight on text
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#ffeaa7';
      ctx.strokeText('OM', 128, 134);

      // 2. Convert Canvas PNG data to a genuine Windows .ICO binary structure
      canvas.toBlob((blob) => {
        blob.arrayBuffer().then((pngBuffer) => {
          const pngBytes = new Uint8Array(pngBuffer);
          const icoHeaderSize = 6;
          const icoDirEntrySize = 16;
          const totalSize = icoHeaderSize + icoDirEntrySize + pngBytes.length;
          const icoBuffer = new Uint8Array(totalSize);
          const view = new DataView(icoBuffer.buffer);

          // ICONDIR header
          view.setUint16(0, 0, true);     // Reserved (0)
          view.setUint16(2, 1, true);     // Image type: 1 = ICO
          view.setUint16(4, 1, true);     // Number of images (1)

          // ICONDIRENTRY entry
          view.setUint8(6, 0);            // Width: 0 means 256px
          view.setUint8(7, 0);            // Height: 0 means 256px
          view.setUint8(8, 0);            // Color count (0 = no palette)
          view.setUint8(9, 0);            // Reserved
          view.setUint16(10, 1, true);    // Color planes (1)
          view.setUint16(12, 32, true);   // Bits per pixel (32)
          view.setUint32(14, pngBytes.length, true); // Size of PNG data
          view.setUint32(18, 22, true);   // Offset to PNG data (6 + 16 = 22)

          // Append the PNG image payload
          icoBuffer.set(pngBytes, 22);

          // 3. Trigger download
          const icoBlob = new Blob([icoBuffer], { type: 'image/x-icon' });
          const url = URL.createObjectURL(icoBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'OM.ico';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          document.getElementById('dlBtn').onclick = () => {
            const retry = document.createElement('a');
            retry.href = url;
            retry.download = 'OM.ico';
            retry.click();
          };
        });
      }, 'image/png');
    }

    window.onload = generateAndDownloadICO;
  </script>
</body>
</html>
